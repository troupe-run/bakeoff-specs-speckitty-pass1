[project]
name = "troupe"
version = "0.1.0"
description = "troupe configuration subsystem"
requires-python = ">=3.12"
dependencies = ["eventsourcing>=9.5,<10", "ruamel.yaml>=0.19,<0.20"]

[project.scripts]
troupe = "troupe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/troupe"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Planning artifacts (Markdown with illustrative code blocks) are not project source.
extend-exclude = ["kitty-specs", ".kittify"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
