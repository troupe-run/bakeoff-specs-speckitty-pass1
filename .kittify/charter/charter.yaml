    summary: "Triage identified documentation gaps by user impact and fill them in priority order. Not all gaps are equal — a missing tutorial for a core workflow blocks more users than a missing explanation for an edge-case design decision. Prioritisation ensures that limited capacity is directed toward the gaps that most impede the target audience.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-documentation-gap-prioritization.md
  - id: PROCEDURE:domain-aware-decision-interview
    kind: procedure
