  - id: TACTIC:acceptance-test-first
    kind: tactic
    title: Acceptance Test Driven Development (ATDD)
    summary: Anchor implementation work in externally observable behavior before internal coding begins.
    source_path: ''
    local_path: _LIBRARY/tactic-acceptance-test-first.md
  - id: TACTIC:adr-drafting-workflow
    kind: tactic
    title: ADR Drafting Workflow
    summary: Systematically draft Architectural Decision Records with trade-off analysis and risk assessment.
    source_path: ''
    local_path: _LIBRARY/tactic-adr-drafting-workflow.md
  - id: TACTIC:adversarial-qa-handoff
    kind: tactic
    title: Adversarial QA Handoff
    summary: "Prepare code as if review and QA will probe every weak assumption. The agent should identify likely failure modes before handoff and leave clear evidence that behavior, typing, and edge cases were verified.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-adversarial-qa-handoff.md
  - id: TACTIC:aggregate-boundary-design
    kind: tactic
    title: Aggregate Boundary Design
    summary: "Define transactional consistency boundaries within a bounded context by identifying aggregates and their roots. An aggregate is a cluster of domain objects that are treated as a single unit for data changes; the aggregate root is the sole entry point for all modifications. Correct aggregate boundaries enforce invariants without creating unnecessary coupling or oversized transaction scopes. Based on Eric Evans's tactical DDD patterns and Vaughn Vernon's aggregate design rules.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-aggregate-boundary-design.md
  - id: TACTIC:ammerse-impact-analysis
    kind: tactic
    title: AMMERSE Impact Analysis
    summary: "Evaluate the first- and second-order impact of a decision, practice, or architectural choice against the seven AMMERSE values (Agile, Minimal, Maintainable, Environmental, Reachable, Solvable, Extensible) to surface hidden trade-offs and align choices with strategic goals. Reserve the full numeric interaction-matrix analysis for high-stakes decisions; first-order reasoning alone is sufficient for routine choices.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-ammerse-impact-analysis.md
  - id: TACTIC:analysis-extract-before-interpret
    kind: tactic
    title: Extract Before Interpret
    summary: "Prevent premature interpretation by first extracting observable facts and patterns before assigning meaning or drawing conclusions. Separating extraction from interpretation creates a shared factual foundation that reduces bias and allows independent review of raw evidence before reasoning begins. Apply when: analysis or synthesis is required and the risk of premature judgment exists, reviewing code or logs where familiarity might cause assumptions, or any multi-step reasoning task where source material is ambiguous. Not applicable: time-critical decisions requiring immediate interpretation, or source material that is already fully structured and unambiguous.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-analysis-extract-before-interpret.md
  - id: TACTIC:anti-corruption-layer
    kind: tactic
    title: Anti-Corruption Layer
    summary: "Isolate your domain model from external or legacy systems by placing a translation layer at the boundary. The ACL translates between the foreign system's semantics and your own ubiquitous language, preventing external models from leaking into and corrupting your domain design. Originally described by Eric Evans in Domain-Driven Design; also known as Gateway when the emphasis is on translation rather than defense.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-anti-corruption-layer.md
  - id: TACTIC:architectural-gate-non-vacuity
    kind: tactic
    title: architectural-gate-non-vacuity
    summary: Definition unavailable in bundled doctrine.
    source_path: ''
    local_path: _LIBRARY/tactic-architectural-gate-non-vacuity.md
  - id: TACTIC:architecture-diagram-review-checklist
    kind: tactic
    title: Architecture Diagram Review Checklist
    summary: "Provide a structured quality gate for architecture diagrams before they are shared, committed, or included in documentation. Based on the C4 model notation guidelines and diagram review checklist (c4model.com), this tactic ensures every diagram communicates clearly to its intended audience without requiring verbal explanation.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-architecture-diagram-review-checklist.md
  - id: TACTIC:atdd-adversarial-acceptance
    kind: tactic
    title: Adversarial Acceptance Test Definition
    summary: Strengthen acceptance criteria by deliberately exploring how a feature could fail in real usage, then converting selected failure scenarios into adversarial acceptance tests that define reject, constrain, or degrade boundaries.
    source_path: ''
    local_path: _LIBRARY/tactic-atdd-adversarial-acceptance.md
  - id: TACTIC:atomic-design-review-checklist
    kind: tactic
    title: Atomic Design Review Checklist
    summary: "Code review verification tactic for validating that state architecture respects atomic design level boundaries. Each step checks one atomic level against its state ownership contract.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-atomic-design-review-checklist.md
  - id: TACTIC:atomic-state-ownership
    kind: tactic
    title: Atomic State Ownership
    summary: "Assign state ownership to the lowest atomic level that needs it, preventing premature lifting to global stores. Local state stays local; only state consumed by multiple organisms or pages qualifies for centralization.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-atomic-state-ownership.md
  - id: TACTIC:autonomous-operation-protocol
    kind: tactic
    title: Autonomous Operation Protocol
    summary: Enable agents to operate autonomously with clear decision boundaries, commit frequency expectations, and escalation protocols for critical choices.
    source_path: ''
    local_path: _LIBRARY/tactic-autonomous-operation-protocol.md
  - id: TACTIC:avoid-gold-plating
    kind: tactic
    title: Avoid Gold Plating
    summary: "Challenge a proposed implementation or design for unnecessary complexity by asking whether each abstraction or feature addresses a current, observed need. Keeps implementation effort proportional to scope, reduces cyclic complexity, and guards against speculative over-engineering that wastes time and calcifies into technical debt.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-avoid-gold-plating.md
  - id: TACTIC:behavior-driven-development
    kind: tactic
    title: Behavior-Driven Development
    summary: "Define system behavior through concrete examples before implementation, ensuring shared understanding between stakeholders and implementers. BDD scenarios serve as behavioral contracts, acceptance criteria, and executable test definitions simultaneously. Apply when: a feature or business rule is being defined and stakeholders are available, the behavior can be expressed in observable outcomes, or behavioral ambiguity must be resolved before implementation begins. Not applicable: implementation-only tasks with no behavioral ambiguity, purely technical refactoring, or when behavior is already unambiguously specified.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-behavior-driven-development.md
  - id: TACTIC:black-box-integration-testing
    kind: tactic
    title: Black-Box Integration Testing
    summary: "Validate the functionality of an application under test without peering into its internal structures or workings, by driving it through an external interface and asserting on observable outputs. Tests are derived from external descriptions of the software — specifications, requirements, and design parameters — rather than from its code. \"Black-box\" describes the testing technique (no structural knowledge of the system under test), not the size of the slice under test. Applied here at the integration boundary — exercising more than one collaborator together through a single external interface — but the same discipline also applies at the module, acceptance, and system levels.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-black-box-integration-testing.md
  - id: TACTIC:boring-code-review
    kind: tactic
    title: Boring Code Review
    summary: "Keep implementation choices predictable, idiomatic, and easy to inspect. Challenge clever control flow, needless abstraction, and DRY violations that duplicate business meaning rather than harmless syntax.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-boring-code-review.md
  - id: TACTIC:bounded-context-canvas-fill
    kind: tactic
    title: Bounded Context Canvas Fill
    summary: "Guide the reasoning process for completing a Bounded Context Canvas -- a structured one-page summary that captures a context's name, purpose, strategic classification, domain roles, communication patterns, ubiquitous language, business decisions, assumptions, verification metrics, and open questions. This tactic focuses on the analytical thinking required to fill each section well; the fillable canvas itself is a separate template. Based on the DDD Crew Bounded Context Canvas v5.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-bounded-context-canvas-fill.md
  - id: TACTIC:bounded-context-identification
    kind: tactic
    title: Bounded Context Identification
    summary: "Identify and draw boundaries around regions of a system where a single consistent domain model and ubiquitous language apply. Instead of forcing one unified model across an entire organization, accept that different contexts need different models and define explicit integration points between them. Based on Eric Evans's DDD strategic design and Martin Fowler's Bounded Context pattern.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-bounded-context-identification.md
  - id: TACTIC:bug-fixing-checklist
    kind: tactic
    title: Test-First Bug Fixing Checklist
    summary: "Resolve defects through a disciplined sequence that prevents speculative fixes, ensures the defect is reproducible as a test, and verifies no regressions are introduced. Applicable to any language or framework. Do not skip steps under time pressure — shortcuts in bug fixing cause regressions.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-bug-fixing-checklist.md
  - id: TACTIC:c4-zoom-in-architecture-documentation
    kind: tactic
    title: C4 Zoom-In Architecture Documentation
    summary: "Progressively document a system's architecture by starting at the broadest abstraction (system context) and zooming in only where additional detail adds value. Each level targets a specific audience and answers a specific question, preventing the common failure of a single monolithic diagram that serves nobody well. Based on Simon Brown's C4 model (c4model.com).\n"
    source_path: ''
    local_path: _LIBRARY/tactic-c4-zoom-in-architecture-documentation.md
  - id: TACTIC:canonical-source-unification
    kind: tactic
    title: canonical-source-unification
    summary: Definition unavailable in bundled doctrine.
    source_path: ''
    local_path: _LIBRARY/tactic-canonical-source-unification.md
  - id: TACTIC:chain-of-responsibility-rule-pipeline
    kind: tactic
    title: Chain of Responsibility — Rule-Based Pipeline
    summary: "Express a complex multi-step rule application as a pipeline of small, pure, independently-testable functions instead of as one large branching function. Each rule decides on its own applicability, executes its narrow piece of work, and returns a result object that the runner threads to the next rule. The pattern keeps cognitive complexity per function low, makes the rule set readable as a sequence, and lets new rules slot in without re-reading the whole pipeline.\nThis is the codebase's accepted way of dealing with stacks of related but independent rules — validators, classifiers, canonicalizers, scorers, audit detectors. The shape recurs in `src/specify_cli/audit/`, `src/specify_cli/charter_runtime/lint/checks/`, `src/specify_cli/migration/`, and `src/doctrine/agent_profiles/repository.py` (DDR-011 scoring). New code that composes 4+ independent decisions over the same input should reach for this pattern by default.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-chain-of-responsibility-rule-pipeline.md
  - id: TACTIC:change-apply-smallest-viable-diff
    kind: tactic
    title: Change Apply Smallest Viable Diff
    summary: Introduce changes using the smallest possible modification that achieves the stated goal, minimising unintended side effects.
    source_path: ''
    local_path: _LIBRARY/tactic-change-apply-smallest-viable-diff.md
  - id: TACTIC:clean-linear-commit-history
    kind: tactic
    title: clean-linear-commit-history
    summary: Definition unavailable in bundled doctrine.
    source_path: ''
    local_path: _LIBRARY/tactic-clean-linear-commit-history.md
  - id: TACTIC:code-documentation-analysis
    kind: tactic
    title: Code and Documentation Analysis for Boundary Discovery
    summary: "Extract terminology from a codebase and its documentation to identify semantic clusters that reveal implicit context boundaries. Used during domain modelling and architectural review to surface unacknowledged bounded contexts before they calcify into accidental coupling. Success criteria: 100-500 terms extracted, clustered by semantic similarity, clusters mapped to team/directory ownership, proposed boundaries validated with domain experts, and cross-boundary risks identified and documented.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-code-documentation-analysis.md
  - id: TACTIC:code-review-incremental
    kind: tactic
    title: Incremental Code Review
    summary: Review a change set to identify correctness, structural, and architectural risks without rewriting or expanding scope. Formulate feedback as observations and questions, not instructions.
    source_path: ''
    local_path: _LIBRARY/tactic-code-review-incremental.md
  - id: TACTIC:compositional-stream-boundaries
    kind: tactic
    title: Compositional Stream Boundaries
    summary: "Define where reactive streams (RxJS, observables, signals) begin and end within the atomic hierarchy. Prevents stream leak across component boundaries and ensures subscription ownership is explicit.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-compositional-stream-boundaries.md
  - id: TACTIC:connascence-analysis
    kind: tactic
    title: Connascence Analysis
    summary: "Diagnose coupling between software components by classifying it using the connascence taxonomy — examining strength, degree, and locality — and recommend targeted reductions that improve maintainability without unnecessary abstraction.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-connascence-analysis.md
  - id: TACTIC:context-boundary-inference
    kind: tactic
    title: Context Boundary Inference
    summary: "Detect bounded context boundaries from team ownership patterns and terminology conflicts. Use systematic organizational and linguistic analysis to surface implicit domain boundaries before they calcify into accidental coupling. Apply when: a monolith is growing beyond a single team's cognitive bandwidth, teams disagree on what a shared term means, cross-team coupling makes deployment or testing painful, or a strategic design effort is beginning. Success criteria: each proposed context has explicit ownership, ubiquitous language documented per context, translation rules defined at each boundary, no shared mutable state across context boundaries, proposed boundaries validated with domain experts.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-context-boundary-inference.md
  - id: TACTIC:context-mapping-classification
    kind: tactic
    title: Context Mapping Classification
    summary: "Systematically classify every relationship between bounded contexts using the nine canonical DDD context mapping patterns and three relationship types. Produces an explicit map that reveals coupling, power asymmetries, and integration risk across the system. Based on Eric Evans's strategic design patterns and the DDD Crew context-mapping notation.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-context-mapping-classification.md
  - id: TACTIC:cross-cutting-state-via-store
    kind: tactic
    title: Cross-Cutting State via Store
    summary: "Use a centralized store (Redux, NgRx, Zustand, Pinia) exclusively for state that crosses atomic boundaries: auth, theme, locale, feature flags, and domain entities consumed by multiple organisms on different pages. Keeps the store lean and purposeful.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-cross-cutting-state-via-store.md
  - id: TACTIC:decision-marker-capture
    kind: tactic
    title: Decision Marker Capture
    summary: Ensure architectural decisions made during implementation are captured as traceable records with rationale, alternatives, and consequences, so future maintainers can understand why a choice was made.
    source_path: ''
    local_path: _LIBRARY/tactic-decision-marker-capture.md
  - id: TACTIC:deepening-opportunity-assessment
    kind: tactic
    title: Deepening Opportunity Assessment
    summary: "Identify whether a shallow cluster of modules should be deepened into a higher-leverage module with a smaller, more stable interface. The assessment focuses on real caller friction, test seam quality, dependency shape, and locality of future changes rather than on abstract cleanliness.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-deepening-opportunity-assessment.md
  - id: TACTIC:delete-the-assertion-not-the-test
    kind: tactic
    title: delete-the-assertion-not-the-test
    summary: Definition unavailable in bundled doctrine.
    source_path: ''
    local_path: _LIBRARY/tactic-delete-the-assertion-not-the-test.md
  - id: TACTIC:dependency-hygiene
    kind: tactic
    title: Dependency Hygiene
    summary: "Keep a project's dependency tree free of known vulnerabilities and non-compliant licenses. Apply at project creation, when adding any dependency, and as part of regular pre-release maintenance. Apply when: starting a new project, adding or upgrading any dependency, a vulnerability scanner reports new CVEs, or preparing a release. For JavaScript/TypeScript projects specifically, dependency hygiene also covers install-time supply-chain safety (registry authenticity, package freshness, lifecycle-script discipline, lockfile behavior, and Node runtime baseline) per the supply-chain-install-safety directive and tactic — see the JS/TS-specific steps below.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-dependency-hygiene.md
  - id: TACTIC:development-bdd
    kind: tactic
    title: BDD as Behavioral Contract Design
    summary: "Use Behaviour-Driven Development principles to define observable behavioral contracts before implementation begins, ensuring system boundaries are expressed in terms stakeholders can validate. Apply during design to establish what the system must do at its public interfaces — not how to write test scenarios (see the behavior-driven-development tactic for that). Outputs of this tactic serve as the behavioral contract that step definitions later implement.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-development-bdd.md
  - id: TACTIC:documentation-curation-audit
    kind: tactic
    title: Documentation Curation Audit
    summary: Systematically audit a documentation directory for structural consistency, naming conventions, cross-reference integrity, and metadata completeness.
    source_path: ''
    local_path: _LIBRARY/tactic-documentation-curation-audit.md
  - id: TACTIC:domain-event-capture
    kind: tactic
    title: Domain Event Capture
    summary: "Funnel significant state changes through immutable Domain Event objects that are persisted before processing. Separates input recording from business reaction, enabling auditability, replay, and decoupled system evolution. Based on Martin Fowler's Domain Event pattern and Eric Evans's DDD events.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-domain-event-capture.md
  - id: TACTIC:easy-to-change
    kind: tactic
    title: Easy-to-Change Design Review
    summary: "Assess whether a proposed or existing design keeps the cost of future change proportional to the value gained. Identifies where assumptions are embedded in the wrong places, flags premature abstraction, and recommends minimal structural investments that preserve adaptability without over-engineering.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-easy-to-change.md
  - id: TACTIC:eisenhower-prioritisation
    kind: tactic
    title: Eisenhower Prioritisation
    summary: "Assign each pending task an importance and urgency rating so that the most valuable work is tackled first and low-value work is explicitly eliminated or delegated. Prevents constant busyness from masking a lack of meaningful progress.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-eisenhower-prioritisation.md
  - id: TACTIC:entity-value-object-classification
    kind: tactic
    title: Entity vs Value Object Classification
    summary: "Classify every domain object as either an Entity (has identity, mutable lifecycle) or a Value Object (defined solely by its attributes, immutable, no identity). The default heuristic is to prefer Value Objects; promote to Entity only when the domain requires tracking identity across state changes. Correct classification reduces complexity, improves testability, and makes the domain model more expressive. Based on Eric Evans's DDD tactical patterns.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-entity-value-object-classification.md
  - id: TACTIC:five-paradigm-parallel-debugging
    kind: tactic
    title: Five-Paradigm Parallel Debugging
    summary: "Investigate stubborn, recurring, or shape-shifting bugs by dispatching five sub-agents in parallel, each constrained to a different debugging epistemology. Independent investigations converge on a single structural fix while each surfaces findings the others structurally cannot. Produces one structural intervention, not five point-fixes.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-five-paradigm-parallel-debugging.md
  - id: TACTIC:focused-function-complexity-check
    kind: tactic
    title: Focused Function Complexity Check
    summary: "Keep functions focused, readable, and bounded in complexity without splitting behavior into needless fragments. The goal is clear units of behavior whose control flow can be inspected quickly.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-focused-function-complexity-check.md
  - id: TACTIC:forensic-repository-audit
    kind: tactic
    title: Forensic Repository Audit
    summary: "Extract durable, evidence-backed signals about the health of an unfamiliar codebase from version control history and surface them as concrete questions a maintainer must answer: where is risk concentrated, who knows this code, is the project alive, does the team trust the pipeline, is anything abandoned, and is complexity load-bearing? The output is not a verdict but a structured inventory of hotspots, ownership, velocity, and firefighting frequency that other doctrine artifacts (triage, prioritisation, premortem, connascence analysis) can act on.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-forensic-repository-audit.md
  - id: TACTIC:formalized-constraint-testing
    kind: tactic
    title: Formalized Constraint Testing
    summary: "Verify mathematical invariants and structural contracts of components using property-based patterns rather than example-based spot-checks. Covers four pattern families: round-trip symmetry, equality contracts, hash-code alignment, and sparse serialization.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-formalized-constraint-testing.md
  - id: TACTIC:frozen-baseline-shrink-only-ratchet
    kind: tactic
    title: frozen-baseline-shrink-only-ratchet
    summary: Definition unavailable in bundled doctrine.
    source_path: ''
    local_path: _LIBRARY/tactic-frozen-baseline-shrink-only-ratchet.md
  - id: TACTIC:function-over-form-testing
    kind: tactic
    title: Function Over Form Testing
    summary: "Prioritize behavioral validation over structural verification in test suites. Tests should prove that the system does what it is supposed to do, not that it was assembled from the right parts. Construction details (constructors, builders, accessors) get tested indirectly through functional tests that exercise the objects they create. Core principle: when behavior is tested thoroughly, construction coverage follows naturally.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-function-over-form-testing.md
  - id: TACTIC:generated-code-stewardship
    kind: tactic
    title: Generated Code Stewardship
    summary: "Treat generated code as maintainable project code. Agents may improve it, but they must not leave behind bloated, unexplained, untyped, or hard-to-review output simply because it was generated.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-generated-code-stewardship.md
  - id: TACTIC:glossary-curation-interview
    kind: tactic
    title: Glossary Curation Interview
    summary: Systematically expand a living glossary through structured HiC-led curation rounds, ensuring all new terms are clear, well-grouped, and approved before inclusion.
    source_path: ''
    local_path: _LIBRARY/tactic-glossary-curation-interview.md
  - id: TACTIC:input-validation-fail-fast
    kind: tactic
    title: Input Validation with Fail-Fast Feedback
    summary: Validate input data comprehensively before processing to avoid wasting resources on invalid data. Provide clear, actionable feedback on errors while protecting system internals from exposure.
    source_path: ''
    local_path: _LIBRARY/tactic-input-validation-fail-fast.md
  - id: TACTIC:interface-variation-design
    kind: tactic
    title: Interface Variation Design
    summary: "Explore materially different interface shapes before committing to a deepened module design. The tactic reduces first-idea bias by comparing interfaces on leverage, locality, misuse resistance, dependency strategy, and how naturally behavior can be tested through the same surface callers use.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-interface-variation-design.md
  - id: TACTIC:language-driven-design
    kind: tactic
    title: Language-Driven Design
    summary: "Treat language drift as an architectural signal. When terminology becomes inconsistent or ambiguous across code, docs, and conversation, it predicts deeper structural problems. Reviewers use linguistic checks to catch architectural issues before they manifest as bugs or coupling.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-language-driven-design.md
  - id: TACTIC:locality-of-change
    kind: tactic
    title: Locality of Change Assessment
    summary: "Systematic decision protocol for evaluating whether a proposed change adds necessary complexity or introduces premature abstraction. Implements Directive 024 by giving implementers and reviewers a structured method for assessing scope before committing to a solution. Core principle: do not add complexity to solve problems that do not demonstrably exist. Decision checklist — proceed only if 5+ of 7 apply: (1) Can I point to 3+ real instances where the current approach failed? (2) Have I quantified the impact? (3) Have I evaluated \"do nothing\" as an option? (4) Have I explored simpler alternatives first? (5) Does the change preserve or enhance core architectural values? (6) Am I not prescribing too early? (7) Does the change achieve significant value at proportional cost?\n"
    source_path: ''
    local_path: _LIBRARY/tactic-locality-of-change.md
  - id: TACTIC:model-task-routing
    kind: tactic
    title: model-task-routing
    summary: Definition unavailable in bundled doctrine.
    source_path: ''
    local_path: _LIBRARY/tactic-model-task-routing.md
  - id: TACTIC:mutation-testing-workflow
    kind: tactic
    title: Mutation Testing Workflow
    summary: "Verify that tests detect real bugs — not merely execute code. Mutation testing answers \"if I introduced a bug here, would my tests fail?\" where coverage only answers \"did my tests run this line?\".\n"
    source_path: ''
    local_path: _LIBRARY/tactic-mutation-testing-workflow.md
  - id: TACTIC:no-parallel-duplicate-test-runs
    kind: tactic
    title: No Parallel Duplicate Test Runs
    summary: "Prevent agents from launching multiple concurrent runs of the same test suite. Doing so wastes resources, makes output ambiguous, and degrades the developer experience. A single authoritative run must be started, and the agent must wait for its result before deciding on next steps.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-no-parallel-duplicate-test-runs.md
  - id: TACTIC:occurrence-classification-workflow
    kind: tactic
    title: Occurrence Classification Workflow
    summary: "Guide mission authors through classifying string occurrences by semantic context before performing bulk edits.\n"
    source_path: ''
    local_path: _LIBRARY/tactic-occurrence-classification-workflow.md
